  <meta name="author" content="Suhaib Chemban" />
  <meta name="theme-color" content="#050505" />
  <meta name="color-scheme" content="dark" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://suhaib.dev/" />
  <meta property="og:title" content="Suhaib Chemban | Digital Experience Architect" />

  <meta property="og:image" content="/assets/og-image.jpg" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://suhaib.dev/" />
  <meta property="twitter:title" content="Suhaib Chemban | Digital Experience Architect" />
  <meta property="twitter:description" content="I engineer high-performance, award-winning digital experiences that merge cutting-edge technology with premium cinematic aesthetics." />
  <meta property="twitter:image" content="/assets/og-image.jpg" />

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />

  <!-- Preconnect to improve font loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    /* Prevent FOUC and set base theme */
    html {
      background-color: #050505;
    }
    body {
      margin: 0;
      background-color: #050505;
      color: #F2F2F2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    /* Simple elegant loading state before React hydrates */
    #root:empty {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #050505;
    }
    #root:empty::after {
      content: '';
      width: 40px;
      height: 40px;
      border: 2px solid rgba(255, 255, 255, 0.05);
      border-top-color: #7f140f;
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
